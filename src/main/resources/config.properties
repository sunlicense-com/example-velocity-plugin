# MyPlugin
#
# Your license key, from your purchase email or the store's download page.
# If you downloaded this plugin from BuiltByBit or Voxel Shop, the key is already built in: leave this empty.
license-key=

# How often the license is re-checked while the proxy runs, in hours (0 = only at start-up).
recheck-hours=6

# Send anonymous usage statistics (Velocity and Java version, OS, CPU cores, plugin version) to the plugin's
# author every 30 minutes. No player names, IP addresses or server names. false = nothing is sent.
# SUNLICENSE_ANALYTICS=off (environment) or -Dsunlicense.analytics=false switches it off for every plugin.
analytics=true

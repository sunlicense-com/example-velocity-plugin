# Builds and tests the plugin on every push and pull request, and attaches the jar to the run.
# For a release build with your SunLicense settings, add repository secrets SUNLICENSE_API_KEY and
# SUNLICENSE_PUBLIC_KEY (Settings -> Secrets and variables -> Actions); forks and PRs build without them.
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Release builds seal the core (README, "Protection"): add the repository secret SUNLICENSE_TOKEN (a SunLicense
      # personal access token, slp_…) and the variable SUNLICENSE_PRODUCT (your product's code). Without both, the
      # jar is a development build.
      SEAL: ${{ secrets.SUNLICENSE_TOKEN != '' && vars.SUNLICENSE_PRODUCT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the SunLicense CLI
        if: env.SEAL == 'true'
        run: curl -fsSL https://sunlicense.com/install.sh | SUNLICENSE_INSTALL_DIR="$RUNNER_TEMP/sunlicense" sh
      - name: Build and test
        env:
          SUNLICENSE_TOKEN: ${{ secrets.SUNLICENSE_TOKEN }}
          ORG_GRADLE_PROJECT_sunlicenseProduct: ${{ env.SEAL == 'true' && vars.SUNLICENSE_PRODUCT || '' }}
          ORG_GRADLE_PROJECT_sunlicenseCli: ${{ runner.temp }}/sunlicense/sunlicense
          ORG_GRADLE_PROJECT_sunlicenseApiKey: ${{ secrets.SUNLICENSE_API_KEY }}
          ORG_GRADLE_PROJECT_sunlicensePublicKey: ${{ secrets.SUNLICENSE_PUBLIC_KEY }}
        run: ./gradlew build
      # The jar is your paid product: only keep it as a download when the repository is private.
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private
        with:
          name: plugin
          path: ${{ env.SEAL == 'true' && 'build/release/*.jar' || 'build/libs/*.jar' }}
          if-no-files-found: error
          retention-days: 14

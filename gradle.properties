# Your plugin
group=com.example
version=1.0.0

# SunLicense, baked into the jar at build time (src/main/resources/sunlicense.properties).
# Keep real values out of git: pass them with -P or as environment variables in CI
# (ORG_GRADLE_PROJECT_sunlicenseApiKey, ORG_GRADLE_PROJECT_sunlicensePublicKey).
#
# The API server. For a local stack use http://localhost.
sunlicenseUrl=https://api.sunlicense.com
# An API key (slk_...) from the dashboard's API keys page. It can only validate licenses.
sunlicenseApiKey=
# Your organization's Ed25519 public key (dashboard: a license's page -> Public key), for offline
# license files. Empty = no offline fallback.
sunlicensePublicKey=

org.gradle.configuration-cache=true
